# Builds the production image on every push to develop and boots the native gems inside it, so a
# broken Dockerfile or gem platform shows up here before a Railway deploy. Nothing is pushed:
# Railway (Hobby plan) builds its own image from the repo.
name: Railway image

on:
  push:
    branches: [develop]
  pull_request:
    paths: [docker/Dockerfile, Gemfile, Gemfile.lock, package.json, pnpm-lock.yaml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'alezlam/chatwoot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: chatwoot:ci
          build-args: RAILWAY_GIT_COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Load native gems
        run: >
          docker run --rm chatwoot:ci bundle exec ruby -e
          'require "grpc"; require "google/protobuf"; require "nokogiri"; require "pg"; require "datadog";
          puts "grpc #{GRPC::VERSION} protobuf #{Google::Protobuf::VERSION rescue "ok"} nokogiri #{Nokogiri::VERSION}"'
