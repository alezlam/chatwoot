# Builds the app image once per push to develop and pushes it to GHCR. Railway's web and worker
# services both run this image, so a deploy no longer compiles grpc twice; the layer cache skips
# bundle install entirely while Gemfile.lock is unchanged.
name: Railway image

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: railway-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: github.repository == 'alezlam/chatwoot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: RAILWAY_GIT_COMMIT_SHA=${{ github.sha }}
          tags: |
            ghcr.io/alezlam/chatwoot:${{ github.sha }}
            ghcr.io/alezlam/chatwoot:develop
          cache-from: type=gha
          cache-to: type=gha,mode=max
