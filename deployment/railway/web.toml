# Railway "web" service: Rails (dashboard, API, webhooks, ActionCable).
# Service settings → Config-as-code → Railway config file: /deployment/railway/web.toml
[build]
builder = "DOCKERFILE"
dockerfilePath = "docker/Dockerfile"

[deploy]
preDeployCommand = ["bundle exec rails db:chatwoot_prepare"]
startCommand = "bundle exec rails s -p $PORT -b 0.0.0.0"
healthcheckPath = "/api"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
